<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商務中文拼音標注</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="page-head">
    <h1 id="page-title" class="page-title"></h1>
    <p id="page-subtitle" class="page-subtitle"></p>
  </header>

  <div class="toolbar" role="toolbar" aria-label="工具列">
    <div class="sample-group">
      <label id="sample-label" for="sample-select"></label>
      <select id="sample-select"></select>
    </div>

    <div class="size-group" role="group" aria-label="字級">
      <span id="size-label" class="size-label"></span>
      <button type="button" class="size-btn" data-size="sm">小</button>
      <button type="button" class="size-btn" data-size="md">中</button>
      <button type="button" class="size-btn" data-size="lg">大</button>
    </div>

    <div class="action-group">
      <button id="btn-copy" type="button" class="tool-btn"></button>
      <button id="btn-clear" type="button" class="tool-btn"></button>
    </div>
  </div>

  <section class="input-section">
    <label id="input-label" for="article-input" class="section-label"></label>
    <textarea id="article-input" rows="9" spellcheck="false"></textarea>
    <div class="input-meta">
      <span id="char-count"></span>
    </div>
  </section>

  <section class="output-section">
    <h2 id="output-label" class="section-label"></h2>
    <div id="article-output" class="article-output" aria-live="polite"></div>
    <p id="output-placeholder" class="output-placeholder"></p>
  </section>

  <section class="vocab-section">
    <h2 id="vocab-label" class="section-label"></h2>
    <div id="vocab-list" class="vocab-list"></div>
    <p id="vocab-placeholder" class="output-placeholder"></p>
  </section>

</div>

<script src="vendor/pinyin-pro.min.js"></script>
<script src="pinyin.js"></script>
<script src="samples.js"></script>
<script src="draft-store.js"></script>
<script src="app.js"></script>
</body>
</html>
